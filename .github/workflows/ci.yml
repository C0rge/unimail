name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PySide6 在无显示环境下导入 QtWidgets 需要它；本套件不建 QApplication，
  # 但 ui 包在 import 期就会拉起 Qt，所以必须显式指定。
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: ruff
        run: python -m ruff check .
      - name: mypy
        run: python -m mypy

  audit:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装 pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.7"
      - name: pip-audit
        # 有已知漏洞就断开构建——这是唯一的「第三方代码」防线，
        # 不能设 continue-on-error，否则等于没扫。
        run: python -m pip_audit -r requirements.txt

  test:
    name: 测试 ${{ matrix.os }} / py${{ matrix.python-version }} / sqlcipher=${{ matrix.sqlcipher }}
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        # 有/无 SQLCipher 是两条不同的代码路径：降级模式（SQLite + 字段级加密）
        # 与整库加密（AES-256 + v3→v4 迁移 + 迁移中断回滚）必须都覆盖到。
        sqlcipher: [full, degraded]
        exclude:
          # 减少组合数：Windows 上只跑一个 Python 版本 × 两种 SQLCipher 状态
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Linux 依赖（Qt 运行库）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 打印加密驱动状态
        if: matrix.sqlcipher == 'full'
        shell: bash
        run: |
          python -c "import sqlcipher3, sqlite3; print('sqlcipher3 OK, SQLite', sqlite3.sqlite_version)"

      - name: 卸载 SQLCipher（降级模式）
        if: matrix.sqlcipher == 'degraded'
        run: python -m pip uninstall -y sqlcipher3-wheels

      - name: 运行回归套件
        run: python tests/smoke.py

      - name: 确认降级模式确实降级了
        if: matrix.sqlcipher == 'degraded'
        shell: bash
        run: |
          python -c "
          from unimail.storage import sqlcipher_available
          assert sqlcipher_available() is False, 'sqlcipher3 仍然可导入，降级模式没生效'
          print('降级模式确认：sqlcipher_available() == False')
          "

      - name: 确认整库加密模式确实可用
        if: matrix.sqlcipher == 'full'
        shell: bash
        run: |
          python -c "
          from unimail.storage import sqlcipher_available
          assert sqlcipher_available() is True, 'sqlcipher3 不可用，加密模式没生效'
          print('加密模式确认：sqlcipher_available() == True')
          "
